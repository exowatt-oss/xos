# WirePlumber: prefer a Logitech Rally Bar (USB mode) as the speaker and microphone whenever it's
# plugged in, over HDMI audio and anything else. Meet uses the default devices.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_(output|input).*Logitech.*Rally.*" } ]
    actions = { update-props = { priority.session = 2000, priority.driver = 2000 } }
  }
]
