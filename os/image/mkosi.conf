# Xos appliance image: Debian 13 (trixie) amd64, bootable with systemd-boot, with the Xos
# appliance installed for one role. Untested sketch (see README.md); the prototype path is
# os/appliance/install.sh on a stock Debian 13.
#
#   mkosi --environment=XOS_ROLE=room --environment=XOS_ROOM=atrium build
#   mkosi --environment=XOS_ROLE=display --environment=XOS_SHOW=page/atrium-room build

[Distribution]
Distribution=debian
Release=trixie
Architecture=x86-64
Repositories=main,non-free-firmware

[Output]
Format=disk
ImageId=xos-appliance
SplitArtifacts=yes

[Build]
# The Xos checkout this image installs (os/, app/, static/), mounted at /work/xos for postinst.
BuildSources=../..:xos

[Content]
Bootable=yes
Bootloader=systemd-boot
KernelCommandLine=quiet loglevel=3 systemd.show_status=auto rd.udev.log_level=3
Packages=
        linux-image-amd64
        systemd
        systemd-boot
        systemd-resolved
        systemd-timesyncd
        dbus
        udev
        firmware-intel-graphics
        firmware-intel-sound
        firmware-realtek
        intel-media-va-driver
        cage
        chromium
        python3
        curl
        ca-certificates
        dbus-user-session
        fonts-noto-color-emoji
        pipewire
        pipewire-pulse
        pipewire-alsa
        wireplumber
        unattended-upgrades
        v4l-utils
# No root password and no SSH: maintenance is through updates; add a key here for a pilot.
RootPassword=
