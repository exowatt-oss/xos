[project]
name = "xos"
version = "0.2.0"
description = "Xos server: a self-hostable hub for room TVs, remotes, door panels, signage and Linux room computers, with a web Admin and an MCP surface"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.139.0",
    "uvicorn[standard]>=0.50.2",
    "pydantic-settings>=2.14.2",
    "httpx>=0.28.1",
    "segno>=1.6",
    "mcp>=2.0.0,<3.0.0",
    # Sign-in: verifies the identity an auth proxy (oauth2-proxy, any OIDC provider) forwards.
    "forwarded-auth[fastapi,mcp] @ git+https://github.com/exowatt-oss/forwarded-auth@2a3463c4ed4da46591f4c0ec930bb3483e12dafd",
    "adb-shell[async]>=0.4.4",
]

[dependency-groups]
dev = [
    "ruff>=0.15.20",
    "pytest>=9.1.1",
    "pytest-xdist>=3.6",
    "httpx>=0.28.1",
]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["os", "app", "static"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
